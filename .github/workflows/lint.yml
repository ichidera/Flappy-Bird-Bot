name: Lint

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - name: Syntax check
        run: python -m py_compile flappy_bot.py recon_flappy.py
      - name: Lint (errors only)
        run: flake8 flappy_bot.py recon_flappy.py --select=E9,F63,F7,F82 --show-source